name: Atualizar notícias ambientais

on:
  schedule:
    - cron: "17 * * * *"   # a cada hora
  workflow_dispatch:        # permite rodar manualmente em Actions > Run workflow

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar manchetes
        run: python scripts/fetch_news.py news.json
      - name: Publicar se mudou
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "chore: atualiza manchetes ambientais"
            git push
          fi
