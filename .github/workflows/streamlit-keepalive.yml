name: Streamlit Keep-Alive

on:
  schedule:
    # A cada 4 horas (UTC). O Streamlit hiberna após 12 horas sem acesso.
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visitar e despertar os aplicativos
        env:
          PYTHONUNBUFFERED: "1"
          KEEPALIVE_CONCURRENCY: "4"
        run: python scripts/keepalive.py
